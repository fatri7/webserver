<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录 - WebServer</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .form-box { background: #1e293b; padding: 2rem; border-radius: 12px; width: 300px; border: 1px solid #334155; }
        h2 { text-align: center; margin-bottom: 1.5rem; color: #00ff88; }
        input { width: 100%; padding: 10px; margin-bottom: 1rem; background: #334155; border: none; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #00ff88; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
        button:hover { opacity: 0.9; }
        .link { text-align: center; margin-top: 1rem; font-size: 0.9rem; }
        a { color: #38bdf8; text-decoration: none; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>用户登录</h2>
        <form action="/login" method="post">
            <input type="text" name="username" placeholder="用户名" required>
            <input type="password" name="password" placeholder="密码" required>
            <button type="submit">立即登录</button>
        </form>
        <div class="link">
            没有账号？ <a href="/register.html">去注册</a> | <a href="/">回首页</a>
        </div>
    </div>
</body>
</html>
